# Простая конфигурация nginx для записи в archive.csv
# Требуется: OpenResty или nginx с lua-nginx-module

server {
    listen 80;
    server_name 194.87.103.77;

    root /var/www/html/results;
    index index.html;

    # API endpoint для записи в CSV
    location /api/submit {
        # Только POST
        limit_except POST {
            deny all;
        }

        # CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Lua скрипт для записи
        content_by_lua_block {
            local file = "/var/www/html/results/archive.csv"
            
            -- Читаем данные
            ngx.req.read_body()
            local data = ngx.req.get_body_data()
            
            -- Создаём файл с заголовком если его нет
            local f = io.open(file, "r")
            if not f then
                f = io.open(file, "w")
                f:write("Student ID,Activity,Grade,Comment,Date/Time\n")
                f:close()
            end
            
            -- Добавляем запись
            f = io.open(file, "a")
            f:write(data .. "\n")
            f:close()
            
            -- Ответ
            ngx.header["Content-Type"] = "application/json"
            ngx.say('{"success":true}')
        }
    }

    # Статические файлы
    location / {
        try_files $uri $uri/ /index.html;
    }
}
