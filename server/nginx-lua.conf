# ============================================
# Nginx + Lua конфигурация для Student Tracker
# ============================================
#
# Требования: OpenResty или nginx с lua-nginx-module
# Установка OpenResty: https://openresty.org/
#
# Этот конфиг:
# 1. Раздаёт статические файлы приложения
# 2. Принимает POST-запросы и записывает в CSV
# 3. Обеспечивает SSL/TLS
# 4. Поддерживает динамическое имя CSV файла
# ============================================

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server {
    listen 80;
    server_name 194.87.103.77;
    
    # Для HTTP (без редиректа на HTTPS для тестирования)
    # Если нужен HTTPS, раскомментируйте строку ниже:
    # return 301 https://$server_name$request_uri;
    
    # Путь к корню приложения
    root /var/www/student-tracker;
    
    # ==========================================
    # API: Приём данных и запись в CSV
    # ==========================================
    location /api/submit {
        # Rate limiting
        limit_req zone=api_limit burst=10 nodelay;
        
        # Только POST и OPTIONS
        limit_except POST OPTIONS {
            deny all;
        }

        # CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Request-Token, X-Request-Time, X-CSV-Filename';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }

        # Обработка через Lua
        content_by_lua_block {
            -- Базовая директория для CSV файлов
            local base_dir = "/var/www/student-tracker/data/"
            
            -- Получаем имя файла из query параметра или заголовка
            local args = ngx.req.get_uri_args()
            local filename = args.file or ngx.req.get_headers()["x-csv-filename"] or "archive.csv"
            
            -- Защита от path traversal - только буквы, цифры, точки, дефисы, подчёркивания
            filename = filename:gsub("[^%w%.%-_]", "")
            
            -- Если пустое имя - используем archive.csv
            if filename == "" or filename == "." then
                filename = "archive.csv"
            end
            
            -- Убеждаемся что расширение .csv
            if not filename:match("%.csv$") then
                filename = filename .. ".csv"
            end
            
            local csv_file = base_dir .. filename

            -- CORS заголовки
            ngx.header["Access-Control-Allow-Origin"] = "*"
            ngx.header["Content-Type"] = "application/json; charset=utf-8"
            
            -- Проверка токена
            local token = ngx.req.get_headers()["x-request-token"]
            if not token or token == "" then
                ngx.status = 401
                ngx.say('{"success":false,"message":"Токен отсутствует"}')
                return
            end
            
            -- Ключ шифрования
            local key = "StGr@2024!SecKey"
            
            -- Дешифрование (XOR + Base64)
            local function xor_decrypt(encoded, key)
                local data = ngx.decode_base64(encoded)
                if not data then return nil end
                local result = ""
                for i = 1, #data do
                    local byte = data:byte(i)
                    local key_byte = key:byte((i - 1) % #key + 1)
                    result = result .. string.char(bit.bxor(byte, key_byte))
                end
                return result
            end
            
            -- Читаем тело запроса
            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            
            if not body or body == "" then
                ngx.status = 400
                ngx.say('{"success":false,"message":"Пустое тело запроса"}')
                return
            end
            
            -- Дешифруем данные
            local decrypted = xor_decrypt(body, key)
            if not decrypted then
                ngx.status = 400
                ngx.say('{"success":false,"message":"Ошибка дешифрования"}')
                return
            end
            
            -- Создаём директорию если нужно
            os.execute("mkdir -p " .. base_dir)

            -- Проверяем существование файла
            local f = io.open(csv_file, "r")
            if not f then
                -- Создаём новый файл с заголовком
                f = io.open(csv_file, "w")
                if f then
                    f:write("Student ID,Activity,Grade,Comment,Date/Time\n")
                    f:close()
                else
                    ngx.status = 500
                    ngx.say('{"success":false,"message":"Не удалось создать файл"}')
                    return
                end
            else
                f:close()
            end
            
            -- Добавляем запись
            f = io.open(csv_file, "a")
            if not f then
                ngx.status = 500
                ngx.say('{"success":false,"message":"Не удалось открыть файл для записи"}')
                return
            end
            f:write(decrypted .. "\n")
            f:close()
            
            -- Успешный ответ
            ngx.say('{"success":true,"message":"Запись сохранена в ' .. filename .. '"}')
        }
    }

    # ==========================================
    # API: Получение списка CSV файлов
    # ==========================================
    location /api/files {
        content_by_lua_block {
            local base_dir = "/var/www/student-tracker/data/"
            
            ngx.header["Access-Control-Allow-Origin"] = "*"
            ngx.header["Content-Type"] = "application/json; charset=utf-8"
            
            -- Читаем директорию
            local files = {}
            local i = 1
            for filename in io.popen('ls "' .. base_dir .. '"*.csv 2>/dev/null'):lines() do
                files[i] = filename:match("([^/]+)$")
                i = i + 1
            end
            
            -- Формируем JSON ответ
            local json = "["
            for idx, f in ipairs(files) do
                if idx > 1 then json = json .. "," end
                json = json .. '"' .. f .. '"'
            end
            json = json .. "]"
            
            ngx.say(json)
        }
    }

    # ==========================================
    # Статические файлы приложения
    # ==========================================
    location / {
        root /var/www/student-tracker;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/student-tracker;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Запрет прямого доступа к data директории
    location /data/ {
        internal;
        alias /var/www/student-tracker/data/;
    }

    # Логирование
    access_log /var/log/nginx/student-tracker-access.log;
    error_log /var/log/nginx/student-tracker-error.log;
}
