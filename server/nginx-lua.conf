# ============================================
# Nginx + Lua конфигурация для Student Tracker
# ============================================
#
# Требования: OpenResty или nginx с lua-nginx-module
# Установка OpenResty: https://openresty.org/
#
# Этот конфиг:
# 1. Раздаёт статические файлы приложения
# 2. Принимает POST-запросы и записывает в CSV
# 3. Обеспечивает SSL/TLS
# 4. Не требует отдельного серверного приложения!
# ============================================

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server {
    listen 80;
    server_name your-domain.com;
    
    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL сертификаты
    ssl_certificate     /etc/ssl/certs/student-tracker.crt;
    ssl_certificate_key /etc/ssl/private/student-tracker.key;
    
    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Безопасность заголовки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Путь к CSV файлу
    set $csv_file "/var/www/student-tracker/data/records.csv";
    set $encryption_key "StGr@2024!SecKey";

    # ==========================================
    # API: Приём данных и запись в CSV
    # ==========================================
    location /api/submit {
        # Rate limiting
        limit_req zone=api_limit burst=10 nodelay;
        
        # Только POST и OPTIONS
        limit_except POST {
            deny all;
        }

        # CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Request-Token, X-Request-Time';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }

        # Обработка через Lua
        content_by_lua_block {
            local csv_file = "/var/www/student-tracker/data/records.csv"
            local key = "StGr@2024!SecKey"
            
            -- CORS заголовки
            ngx.header["Access-Control-Allow-Origin"] = "*"
            ngx.header["Content-Type"] = "application/json; charset=utf-8"
            
            -- Проверка токена
            local token = ngx.req.get_headers()["x-request-token"]
            if not token or token == "" then
                ngx.status = 401
                ngx.say('{"success":false,"message":"Токен отсутствует"}')
                return
            end
            
            -- Дешифрование токена (XOR + Base64)
            local function xor_decrypt(encoded, key)
                local data = ngx.decode_base64(encoded)
                if not data then return nil end
                local result = ""
                for i = 1, #data do
                    local byte = data:byte(i)
                    local key_byte = key:byte((i - 1) % #key + 1)
                    result = result .. string.char(bit.bxor(byte, key_byte))
                end
                return result
            end
            
            -- Проверка валидности токена
            local decoded_token = xor_decrypt(token, key)
            if not decoded_token then
                ngx.status = 401
                ngx.say('{"success":false,"message":"Невалидный токен"}')
                return
            end
            
            -- Читаем тело запроса
            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            
            if not body or body == "" then
                ngx.status = 400
                ngx.say('{"success":false,"message":"Пустое тело запроса"}')
                return
            end
            
            -- Дешифруем данные
            local decrypted = xor_decrypt(body, key)
            if not decrypted then
                ngx.status = 400
                ngx.say('{"success":false,"message":"Ошибка дешифрования"}')
                return
            end
            
            -- Проверяем существование CSV файла
            local f = io.open(csv_file, "r")
            if not f then
                -- Создаём директорию если нужно
                os.execute("mkdir -p /var/www/student-tracker/data")
                -- Создаём файл с заголовком
                f = io.open(csv_file, "w")
                if not f then
                    ngx.status = 500
                    ngx.say('{"success":false,"message":"Не удалось создать CSV файл"}')
                    return
                end
                f:write("Student ID,Activity,Grade,Comment,Date/Time,File URL\n")
                f:close()
            else
                f:close()
            end
            
            -- Добавляем запись в CSV
            f = io.open(csv_file, "a")
            if not f then
                ngx.status = 500
                ngx.say('{"success":false,"message":"Не удалось открыть CSV файл"}')
                return
            end
            f:write(decrypted .. "\n")
            f:close()
            
            -- Успешный ответ
            ngx.say('{"success":true,"message":"Запись успешно сохранена в CSV"}')
        }
    }

    # ==========================================
    # API: Получение записей (чтение CSV)
    # ==========================================
    location /api/records {
        limit_req zone=api_limit burst=10 nodelay;
        
        content_by_lua_block {
            local csv_file = "/var/www/student-tracker/data/records.csv"
            local key = "StGr@2024!SecKey"
            
            ngx.header["Access-Control-Allow-Origin"] = "*"
            ngx.header["Content-Type"] = "application/json; charset=utf-8"
            
            -- Проверка токена
            local token = ngx.req.get_headers()["x-request-token"]
            if not token or token == "" then
                ngx.status = 401
                ngx.say('{"success":false,"message":"Токен отсутствует"}')
                return
            end
            
            -- Читаем CSV
            local f = io.open(csv_file, "r")
            if not f then
                ngx.say('[]')
                return
            end
            
            local content = f:read("*all")
            f:close()
            
            -- Парсим CSV в JSON
            local lines = {}
            for line in content:gmatch("[^\r\n]+") do
                table.insert(lines, line)
            end
            
            if #lines <= 1 then
                ngx.say('[]')
                return
            end
            
            -- Пропускаем заголовок
            local records = "["
            for i = 2, #lines do
                local values = {}
                for value in lines[i]:gmatch('([^,]+)') do
                    value = value:gsub('^"(.*)"$', '%1')
                    table.insert(values, '"' .. value:gsub('"', '\\"') .. '"')
                end
                if i > 2 then records = records .. "," end
                records = records .. '{"studentId":' .. (values[1] or '""') .. 
                    ',"activity":' .. (values[2] or '""') ..
                    ',"grade":' .. (values[3] or '""') ..
                    ',"comment":' .. (values[4] or '""') ..
                    ',"dateTime":' .. (values[5] or '""') ..
                    ',"fileUrl":' .. (values[6] or '""') .. '}'
            end
            records = records .. "]"
            
            ngx.say(records)
        }
    }

    # ==========================================
    # Статические файлы приложения
    # ==========================================
    location / {
        root /var/www/student-tracker;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/student-tracker;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Запрет доступа к data директории напрямую
    location /data/ {
        internal;
        alias /var/www/student-tracker/data/;
    }

    # Логирование
    access_log /var/log/nginx/student-tracker-access.log;
    error_log /var/log/nginx/student-tracker-error.log;
}
