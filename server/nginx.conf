# Nginx Configuration for Student Tracker
# ==========================================
# 
# Этот файл содержит конфигурацию nginx для:
# 1. Раздачи статических файлов приложения
# 2. Проксирования API-запросов к Node.js серверу
# 3. SSL/TLS для безопасной передачи данных
#
# Установка:
# 1. Скопируйте этот файл в /etc/nginx/sites-available/student-tracker
# 2. Создайте симлинк: ln -s /etc/nginx/sites-available/student-tracker /etc/nginx/sites-enabled/
# 3. Отредактируйте server_name и пути
# 4. Перезапустите nginx: systemctl reload nginx

# Основной сервер
server {
    listen 80;
    server_name your-domain.com;
    
    # Перенаправление на HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL сертификаты (Let's Encrypt или self-signed)
    ssl_certificate /etc/ssl/certs/student-tracker.crt;
    ssl_certificate_key /etc/ssl/private/student-tracker.key;
    
    # SSL настройки безопасности
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' https://your-domain.com;" always;

    # Ограничение размера запроса
    client_max_body_size 10M;

    # API endpoint - проксирование к Node.js серверу
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # CORS заголовки
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'POST, GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Request-Token, X-Request-Time' always;
        
        # Обработка preflight запросов
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'POST, GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Request-Token, X-Request-Time';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain';
            return 204;
        }
        
        # Rate limiting
        limit_req zone=api burst=20 nodelay;
    }

    # Статические файлы приложения (собранный Vite build)
    location / {
        root /var/www/student-tracker/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Кэширование статики
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # CSV файлы (только для авторизованных)
    location /data/ {
        internal;  # Доступ только через проксирование
        alias /var/www/student-tracker/data/;
    }

    # Логирование
    access_log /var/log/nginx/student-tracker-access.log;
    error_log /var/log/nginx/student-tracker-error.log;
}

# Rate limiting зона
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
