# Конфигурация nginx для Student Tracker с PHP
# Работает с nginx + PHP-FPM (без OpenResty)

server {
    listen 80;
    server_name 194.87.103.77;

    root /var/www/html/results;
    index index.html;

    # API endpoint для записи в CSV
    location /api/submit {
        # CORS заголовки
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

        # Обработка preflight запроса
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Передача запроса в PHP
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/api/submit.php;
        include fastcgi_params;
    }

    # Статические файлы
    location / {
        try_files $uri $uri/ /index.html;
    }
}
