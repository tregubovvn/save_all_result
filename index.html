<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      text-align: center;
      font-size: 28px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
      font-size: 14px;
    }
    input, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.3s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    .grades {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .grade-btn {
      flex: 1;
      min-width: 60px;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: white;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .grade-btn:hover {
      border-color: #667eea;
      transform: translateY(-2px);
    }
    .grade-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    .qr-buttons {
      display: flex;
      gap: 10px;
    }
    .qr-buttons input {
      flex: 1;
    }
    .qr-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #667eea;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .qr-btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .message {
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    .message.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    .message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Student Tracker</h1>
    
    <form id="form">
      <div class="form-group">
        <label>ИД Студента</label>
        <div class="qr-buttons">
          <input type="text" id="studentId" placeholder="Введите или сканируйте QR" required>
          <button type="button" class="qr-btn" onclick="scanQR()">📷</button>
        </div>
      </div>

      <div class="form-group">
        <label>Активность</label>
        <input type="text" id="activity" placeholder="Например: Лабораторная работа" required>
      </div>

      <div class="form-group">
        <label>Оценка</label>
        <div class="grades">
          <button type="button" class="grade-btn" data-grade="5">5</button>
          <button type="button" class="grade-btn" data-grade="4">4</button>
          <button type="button" class="grade-btn" data-grade="3">3</button>
          <button type="button" class="grade-btn" data-grade="2">2</button>
          <button type="button" class="grade-btn" data-grade="1">1</button>
          <button type="button" class="grade-btn" data-grade="0">0</button>
        </div>
      </div>

      <div class="form-group">
        <label>Комментарий</label>
        <textarea id="comment" placeholder="Дополнительные заметки..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Отправить</button>
    </form>

    <div id="message" class="message"></div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    let selectedGrade = '';
    const SERVER_URL = 'http://194.87.103.77/results/api/submit';

    // Выбор оценки
    document.querySelectorAll('.grade-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        selectedGrade = this.dataset.grade;
      });
    });

    // QR сканирование
    function scanQR() {
      const html5QrCode = new Html5Qrcode("qr-reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          document.getElementById('studentId').value = decodedText;
          html5QrCode.stop();
          showMessage('ИД считан из QR-кода', 'success');
        },
        (errorMessage) => {}
      ).catch(err => {
        showMessage('Не удалось запустить камеру', 'error');
      });
    }

    // Отправка формы
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!selectedGrade) {
        showMessage('Выберите оценку', 'error');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Отправка...';

      const data = {
        studentId: document.getElementById('studentId').value,
        activity: document.getElementById('activity').value,
        grade: selectedGrade,
        comment: document.getElementById('comment').value,
        dateTime: new Date().toISOString()
      };

      // Формируем CSV строку
      const csvLine = [
        data.studentId,
        data.activity,
        data.grade,
        data.comment,
        data.dateTime
      ].map(v => `"${v}"`).join(',');

      try {
        const response = await fetch(SERVER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: csvLine
        });

        const result = await response.json();
        
        if (result.success) {
          showMessage('✓ Запись сохранена!', 'success');
          document.getElementById('form').reset();
          document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('active'));
          selectedGrade = '';
        } else {
          showMessage('Ошибка сохранения', 'error');
        }
      } catch (error) {
        showMessage('Ошибка соединения с сервером', 'error');
      }

      btn.disabled = false;
      btn.textContent = 'Отправить';
    });

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
      setTimeout(() => {
        msg.className = 'message';
      }, 3000);
    }
  </script>
</body>
</html>
