<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    body.embed-mode {
      background: transparent;
      padding: 0;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    body.embed-mode .container {
      box-shadow: none;
      border-radius: 0;
      padding: 20px;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      text-align: center;
      font-size: 28px;
    }
    body.embed-mode h1 {
      display: none;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
      font-size: 14px;
    }
    input, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.3s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    .grades {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .grade-btn {
      flex: 1;
      min-width: 60px;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: white;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .grade-btn:hover {
      border-color: #667eea;
      transform: translateY(-2px);
    }
    .grade-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    .qr-buttons {
      display: flex;
      gap: 10px;
    }
    .qr-buttons input {
      flex: 1;
    }
    .qr-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #667eea;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .qr-btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .message {
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    .message.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    .message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Student Tracker</h1>
    
    <form id="form">
      <!-- Student ID -->
      <div class="form-group" data-field="studentId">
        <label>ИД Студента</label>
        <div class="qr-buttons">
          <input type="text" id="studentId" placeholder="Введите или сканируйте QR">
          <button type="button" class="qr-btn" onclick="StudentTracker.scanQR()">📷</button>
        </div>
      </div>

      <!-- Activity -->
      <div class="form-group" data-field="activity">
        <label>Активность</label>
        <input type="text" id="activity" placeholder="Например: Лабораторная работа">
      </div>

      <!-- Grade -->
      <div class="form-group" data-field="grade">
        <label>Оценка</label>
        <div class="grades">
          <button type="button" class="grade-btn" data-grade="5">5</button>
          <button type="button" class="grade-btn" data-grade="4">4</button>
          <button type="button" class="grade-btn" data-grade="3">3</button>
          <button type="button" class="grade-btn" data-grade="2">2</button>
          <button type="button" class="grade-btn" data-grade="1">1</button>
          <button type="button" class="grade-btn" data-grade="0">0</button>
        </div>
      </div>

      <!-- Comment -->
      <div class="form-group" data-field="comment">
        <label>Комментарий</label>
        <textarea id="comment" placeholder="Дополнительные заметки..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Отправить</button>
    </form>

    <div id="message" class="message"></div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    /**
     * Student Tracker - Модульное приложение
     * Поддержка интеграции через URL параметры и JavaScript API
     */
    const StudentTracker = (function() {
      // Конфигурация
      let config = {
        fields: ['studentId', 'activity', 'grade', 'comment'],
        mode: 'standalone', // 'standalone' | 'embed'
        supabaseUrl: 'https://nfoynqfjkvgtqsgwxves.supabase.co',
        supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mb3lucWZqa3ZndHFzZ3d4dmVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNzc3NDUsImV4cCI6MjEwODk1Mzc0NX0.SR2krMy390zOPeVwUjdBAhufwcj57Kk8VQXqFBu3Fdo',
        onSuccess: null,
        onError: null,
        defaultValues: {}
      };

      let selectedGrade = '';
      let html5QrCode = null;

      // Инициализация
      function init() {
        // Парсим URL параметры
        parseUrlParams();
        
        // Применяем конфигурацию
        applyConfig();
        
        // Устанавливаем значения по умолчанию
        applyDefaults();
        
        // Привязываем события
        bindEvents();
        
        // Проверяем что ключ установлен
        if (!config.supabaseKey) {
          console.warn('⚠️ Supabase API ключ не установлен!');
          console.warn('Укажите ключ через URL параметр: ?supabaseKey=YOUR_KEY');
          console.warn('Или через setConfig(): StudentTracker.setConfig({supabaseKey: "YOUR_KEY"})');
        } else {
          console.log('✓ Supabase API ключ установлен');
        }
        
        console.log('Student Tracker initialized', config);
      }

      // Парсинг URL параметров
      function parseUrlParams() {
        const params = new URLSearchParams(window.location.search);
        
        // Режим
        if (params.has('mode')) {
          config.mode = params.get('mode');
        }
        
        // Поля
        if (params.has('fields')) {
          config.fields = params.get('fields').split(',').map(f => f.trim());
        }
        
        // Supabase URL
        if (params.has('supabaseUrl')) {
          config.supabaseUrl = params.get('supabaseUrl');
        }
        
        // Supabase Key
        if (params.has('supabaseKey')) {
          config.supabaseKey = params.get('supabaseKey');
        }
        
        // Значения по умолчанию
        ['studentId', 'activity', 'grade', 'comment'].forEach(field => {
          if (params.has(field)) {
            config.defaultValues[field] = params.get(field);
          }
        });
      }

      // Применение конфигурации
      function applyConfig() {
        // Режим embed
        if (config.mode === 'embed') {
          document.body.classList.add('embed-mode');
        }
        
        // Скрыть/показать поля
        document.querySelectorAll('[data-field]').forEach(el => {
          const field = el.dataset.field;
          if (config.fields.includes(field)) {
            el.classList.remove('hidden');
          } else {
            el.classList.add('hidden');
          }
        });
      }

      // Применение значений по умолчанию
      function applyDefaults() {
        Object.keys(config.defaultValues).forEach(field => {
          const value = config.defaultValues[field];
          if (field === 'grade') {
            setGrade(value);
          } else {
            const input = document.getElementById(field);
            if (input) input.value = value;
          }
        });
      }

      // Привязка событий
      function bindEvents() {
        // Выбор оценки
        document.querySelectorAll('.grade-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            selectedGrade = this.dataset.grade;
          });
        });

        // Отправка формы
        document.getElementById('form').addEventListener('submit', handleSubmit);
      }

      // Установка оценки программно
      function setGrade(grade) {
        selectedGrade = grade;
        document.querySelectorAll('.grade-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.grade === grade);
        });
      }

      // Установка значения поля
      function setFieldValue(field, value) {
        if (field === 'grade') {
          setGrade(value);
        } else {
          const input = document.getElementById(field);
          if (input) input.value = value;
        }
      }

      // Получение значения поля
      function getFieldValue(field) {
        if (field === 'grade') {
          return selectedGrade;
        }
        const input = document.getElementById(field);
        return input ? input.value : '';
      }

      // QR сканирование
      function scanQR() {
        if (html5QrCode) {
          html5QrCode.stop().then(() => {
            html5QrCode = null;
            startQRScan();
          });
        } else {
          startQRScan();
        }
      }

      function startQRScan() {
        html5QrCode = new Html5Qrcode("qr-reader");
        html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          (decodedText) => {
            document.getElementById('studentId').value = decodedText;
            html5QrCode.stop();
            html5QrCode = null;
            showMessage('ИД считан из QR-кода', 'success');
          },
          (errorMessage) => {}
        ).catch(err => {
          showMessage('Не удалось запустить камеру', 'error');
        });
      }

      // Проверка ограничения по времени (10 минут между записями для одного студента)
      async function checkTimeLimit(studentId) {
        try {
          // Получаем последнюю запись для этого студента
          const url = `${config.supabaseUrl}/rest/v1/records?student_id=eq.${encodeURIComponent(studentId)}&order=date_time.desc&limit=1&apikey=${encodeURIComponent(config.supabaseKey)}`;
          
          const response = await fetch(url, {
            headers: {
              'apikey': config.supabaseKey,
              'Authorization': `Bearer ${config.supabaseKey}`
            }
          });

          if (!response.ok) {
            console.warn('Не удалось проверить ограничение по времени');
            return { allowed: true };
          }

          const records = await response.json();
          
          if (records.length === 0) {
            return { allowed: true };
          }

          const lastRecord = records[0];
          const lastTime = new Date(lastRecord.date_time).getTime();
          const now = Date.now();
          const diffMinutes = (now - lastTime) / (1000 * 60);

          if (diffMinutes < 10) {
            const remainingMinutes = Math.ceil(10 - diffMinutes);
            return {
              allowed: false,
              message: `Для студента ${studentId} можно сохранять записи не чаще раза в 10 минут. Подождите ещё ${remainingMinutes} мин.`
            };
          }

          return { allowed: true };
        } catch (error) {
          console.warn('Ошибка проверки ограничения:', error);
          return { allowed: true }; // Если ошибка - разрешаем
        }
      }

      // Отправка формы
      async function handleSubmit(e) {
        e.preventDefault();

        // Валидация
        if (config.fields.includes('grade') && !selectedGrade) {
          showMessage('Выберите оценку', 'error');
          return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Проверка...';

        // Собираем данные
        const data = {
          student_id: getFieldValue('studentId'),
          activity: getFieldValue('activity'),
          grade: getFieldValue('grade'),
          comment: getFieldValue('comment'),
          date_time: new Date().toISOString()
        };

        // Проверка ограничения по времени
        const timeCheck = await checkTimeLimit(data.student_id);
        if (!timeCheck.allowed) {
          showMessage(timeCheck.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Отправить';
          return;
        }

        btn.textContent = 'Отправка...';

        try {
          // Проверка что ключ установлен
          if (!config.supabaseKey) {
            throw new Error('Supabase API ключ не установлен');
          }

          console.log('Отправка в Supabase:', {
            url: `${config.supabaseUrl}/rest/v1/records`,
            hasKey: !!config.supabaseKey,
            keyLength: config.supabaseKey.length
          });

          // Отправка в Supabase с ключом в URL и заголовках
          const url = `${config.supabaseUrl}/rest/v1/records?apikey=${encodeURIComponent(config.supabaseKey)}`;
          const response = await fetch(url, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': config.supabaseKey,
              'Authorization': `Bearer ${config.supabaseKey}`,
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify(data)
          });

          if (response.ok || response.status === 201) {
            showMessage('✓ Запись сохранена!', 'success');
            
            // Показываем кнопку просмотра результатов
            showViewResultsButton(data.student_id);
            
            // Вызываем callback
            if (config.onSuccess && typeof config.onSuccess === 'function') {
              config.onSuccess(data);
            }
            
            // Отправляем событие
            const event = new CustomEvent('studentRecordSaved', {
              detail: { record: data, success: true },
              bubbles: true
            });
            document.dispatchEvent(event);
            
            // PostMessage для iframe
            if (window.parent !== window) {
              window.parent.postMessage({
                type: 'studentRecordSaved',
                record: data,
                success: true
              }, '*');
            }
            
            // Сброс формы
            resetForm();
          } else {
            const errorText = await response.text();
            console.error('Ошибка Supabase:', {
              status: response.status,
              statusText: response.statusText,
              error: errorText
            });
            showMessage('Ошибка сохранения: ' + errorText, 'error');
            triggerError('Server error: ' + errorText);
          }
        } catch (error) {
          showMessage('Ошибка соединения с Supabase', 'error');
          triggerError(error.message);
        }

        btn.disabled = false;
        btn.textContent = 'Отправить';
      }

      // Сброс формы
      function resetForm() {
        document.getElementById('form').reset();
        document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('active'));
        selectedGrade = '';
        applyDefaults();
      }

      // Показать сообщение
      function showMessage(text, type) {
        const msg = document.getElementById('message');
        msg.textContent = text;
        msg.className = 'message ' + type;
        setTimeout(() => {
          msg.className = 'message';
        }, 3000);
      }

      // Trigger error
      function triggerError(message) {
        if (config.onError && typeof config.onError === 'function') {
          config.onError(message);
        }
        
        const event = new CustomEvent('studentRecordError', {
          detail: { message, success: false },
          bubbles: true
        });
        document.dispatchEvent(event);
        
        if (window.parent !== window) {
          window.parent.postMessage({
            type: 'studentRecordError',
            message: message,
            success: false
          }, '*');
        }
      }

      // Показать кнопку просмотра результатов
      function showViewResultsButton(studentId) {
        // Удаляем старую кнопку если есть
        const oldButton = document.getElementById('viewResultsBtn');
        if (oldButton) oldButton.remove();

        // Создаём новую кнопку
        const button = document.createElement('a');
        button.id = 'viewResultsBtn';
        button.href = `student.html?id=${encodeURIComponent(studentId)}`;
        button.className = 'view-results-btn';
        button.innerHTML = '<i class="fas fa-eye"></i> Просмотр всех сохранённых результатов';
        button.style.cssText = `
          display: block;
          margin-top: 15px;
          padding: 14px 20px;
          background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
          color: white;
          text-decoration: none;
          border-radius: 10px;
          font-size: 16px;
          font-weight: 600;
          text-align: center;
          transition: all 0.3s;
          box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        `;
        
        button.addEventListener('mouseenter', function() {
          this.style.transform = 'translateY(-2px)';
          this.style.boxShadow = '0 6px 20px rgba(40, 167, 69, 0.4)';
        });
        
        button.addEventListener('mouseleave', function() {
          this.style.transform = 'translateY(0)';
          this.style.boxShadow = '0 4px 15px rgba(40, 167, 69, 0.3)';
        });

        // Добавляем кнопку после сообщения
        const messageDiv = document.getElementById('message');
        messageDiv.parentNode.insertBefore(button, messageDiv.nextSibling);
      }

      // Публичный API
      return {
        init,
        setFieldValue,
        getFieldValue,
        setGrade,
        scanQR,
        resetForm,
        getConfig: () => config,
        setConfig: (newConfig) => {
          console.log('Обновление конфигурации:', newConfig);
          config = { ...config, ...newConfig };
          console.log('Новая конфигурация:', config);
          applyConfig();
          applyDefaults();
        }
      };
    })();

    // Автоматическая инициализация
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => StudentTracker.init());
    } else {
      StudentTracker.init();
    }
  </script>
</body>
</html>
